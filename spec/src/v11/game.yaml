    get:
      operationId: v11_game_index_get
      summary: Get Game Index
      description: Returns Game Index data for public API consumers. Supports optional
        query filters.
      parameters:
      - in: query
        name: _nPage
        required: false
        schema:
          type: integer
        description: 'Integer. Page to get. Allowed values: >1 Default value: 1'
      - in: query
        name: _nPerpage
        required: false
        schema:
          type: integer
        description: 'Integer. Records per page. Allowed values: >1 Default value:
          5'
      - in: query
        name: _sSort
        required: false
        schema:
          type: string
        description: 'oneOf. String. How to sort the records. Allowed values: see
          ''Sort options and filters'' Default value: -'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          description: Unexpected response
      tags:
      - 'v11: Game'
      x-last-test:
        timestamp: '2026-04-19T17:42:02+00:00'
