  /apiv11/Game/{id}/Subfeed:
    get:
      operationId: v11_game_id_subfeed_get
      summary: Get Game {id} Subfeed
      description: Returns Game {id} Subfeed data for public API consumers. Supports
        optional query filters.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: Required. Enter the Game's ID.
      - in: query
        name: _nPage
        required: false
        schema:
          type: integer
        description: 'Which ''page'' of results to get. Allowed values: greater than
          1. Default value: 1'
      - in: query
        name: _sSort
        required: false
        schema:
          type: string
        description: 'How to sort results. Allowed values: default, new, updated Default
          value: default'
      - in: query
        name: _sName
        required: false
        schema:
          type: string
        description: Observed query parameter
      - in: query
        name: _csvModelInclusions
        required: false
        schema:
          type: string
        description: 'Comma-separated list of sections to include in the search results.
          Allowed values: App, Article, Bug, Blog, Club, Contest, Concept, Event,
          Game, Idea, Initiative, Jam, Mod, Model, Member, News, Poll, Project, Question,
          Review, Request, Script, Sound, Spray, Studio, Thread, Tool, Tutorial, Wiki,
          Wip.'
      - in: query
        name: _csvModelExclusions
        required: false
        schema:
          type: string
        description: 'Comma-separated list of sections to exclude from the search
          results. Allowed values: App, Article, Bug, Blog, Club, Contest, Concept,
          Event, Game, Idea, Initiative, Jam, Mod, Model, Member, News, Poll, Project,
          Question, Review, Request, Script, Sound, Spray, Studio, Thread, Tool, Tutorial,
          Wiki, Wip.'
      - in: query
        name: _csvTagInclusions
        required: false
        schema:
          type: string
        description: 'Comma-separated list of tags to include in the search results.
          Allowed values: IDs as requested from Util/Generic/Tags endpoint.'
      - in: query
        name: _csvTagExclusions
        required: false
        schema:
          type: string
        description: 'Comma-separated list of tags to exclude from the search results.
          Allowed values: IDs as requested from Util/Generic/Tags endpoint.'
      responses:
        '200':
          description: 200 - All defaults
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: 400 - Invalid value for both _csvModelInclusions and _csvModelExclusions
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          description: Unexpected response
      tags:
