  /apiv11/{section_slug}/{submission_id}/Collections:
    get:
      operationId: v11_sectionslug_submission_id_collections_get
      summary: Get {section_slug} {submission Id} Collections
      description: Returns {section_slug} {submission Id} Collections data for public
        API consumers. Supports optional query filters.
      parameters:
      - in: path
        name: section_slug
        required: true
        schema:
          type: string
        description: Path parameter
      - in: path
        name: submission_id
        required: true
        schema:
          type: integer
        description: Path parameter
      - in: query
        name: _nPage
        required: false
        schema:
          type: integer
        description: Query parameter
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          description: Unexpected response
      tags:
      - 'v11: {section_slug}'
      x-last-test:
        timestamp: '2026-04-19T17:42:02+00:00'
        status: 200
        result: ok
        url: https://gamebanana.com/apiv11/Mod/1/Collections
        contentType: application/json; charset=UTF-8
